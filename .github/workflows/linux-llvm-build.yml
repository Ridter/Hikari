name: linux-llvm-build

permissions:
  contents: write

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

jobs:
  build:
    timeout-minutes: 150
    runs-on: ubuntu-latest
    container:
      image: alpine:3.19
    env:
      BUILD_TYPE: Release
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache \
            build-base \
            clang \
            lld \
            ninja \
            ccache \
            cmake \
            python3 \
            git \
            bash \
            linux-headers \
            musl-dev \
            zlib-dev

      - name: Set CORES
        run: echo "CORES=$(nproc)" >> "$GITHUB_ENV"

      - name: Checkout Repo
        uses: actions/checkout@v5.0.0

      - name: Check toolchain versions
        run: |
          clang --version
          ld.lld --version
          ninja --version
          cmake --version

      - name: Configure LLVM
        run: |
          cmake -Bbuild -G Ninja \
            -DLLVM_APPEND_VC_REV=OFF \
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
            -DCMAKE_INSTALL_PREFIX=install \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_OBFUSCATION_LINK_INTO_TOOLS=ON \
            -DLLVM_ENABLE_ZLIB=ON \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_RPMALLOC=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DLLVM_BUILD_STATIC=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCLANG_LINK_CLANG_DYLIB=OFF \
            -DCLANG_BUILD_SHARED_LIBS=OFF \
            -DLIBCLANG_BUILD_STATIC=ON \
            -DCMAKE_SKIP_INSTALL_RPATH=ON \
            -DCMAKE_SKIP_RPATH=ON \
            -DCMAKE_C_FLAGS="-O3 -ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS="-O3 -ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS_RELEASE="-Wl,--gc-sections" \
            -DLLVM_ENABLE_LLD=ON \
            llvm

      - name: Build and install
        run: |
          cmake --build build --target install --parallel "${{ env.CORES }}"

      - name: Verify installation
        run: |
          install/bin/clang --version
          install/bin/ld.lld --version
          echo "int main() { return 0; }" > /tmp/test.c
          install/bin/clang -static -o /tmp/test /tmp/test.c
          /tmp/test && echo "Build verified!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-musl-llvm
          path: install/

      - name: Package llvm
        run: |
          tar -czf linux-musl-llvm.tar.gz -C install .

      - name: Release
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.name }}
          draft: false
          prerelease: false
          files: linux-musl-llvm.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
