name: linux-llvm-build

permissions:
  contents: write

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

jobs:
  build:
    timeout-minutes: 150
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: Release
    steps:
      - name: Set CORES
        run: echo "CORES=$(nproc)" >> "$GITHUB_ENV"

      - name: Checkout Repo
        uses: actions/checkout@v5.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            ninja-build \
            ccache \
            cmake \
            python3

      - name: Check toolchain versions
        run: |
          clang --version
          ld.lld --version
          ninja --version
          cmake --version

      - name: Configure LLVM
        run: |
          cmake -Bbuild -G Ninja \
            -DLLVM_ENABLE_RPMALLOC=OFF \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_TOOLS=ON \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLDB_ENABLE_PYTHON=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
            -DLLVM_OBFUSCATION_LINK_INTO_TOOLS=ON \
            -DCMAKE_INSTALL_PREFIX=install \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            llvm

      - name: Build and install
        run: |
          cmake --build build --target install --parallel "${{ env.CORES }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-llvm
          path: install/

      - name: Package llvm
        run: |
          tar -czf linux-llvm.tar.gz -C install .

      - name: Release
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.name }}
          draft: false
          prerelease: false
          files: linux-llvm.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}